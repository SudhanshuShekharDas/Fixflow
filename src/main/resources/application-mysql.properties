# Used only with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Override any value with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fixflow?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
